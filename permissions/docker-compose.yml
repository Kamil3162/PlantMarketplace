
# docker-compose.yml
version: '3.8'
services:
  web:
    build:
      context: ..
      dockerfile: permissions/Dockerfile
    container_name: permission-service
    command: >
      bash -c " 
      python manage.py makemigrations && 
      python manage.py migrate &&
      python manage.py makemigrations data &&
      python manage.py migrate data &&
      python manage.py runserver 0.0.0.0:8011"
    ports:
      - "8011:8011"
    environment:
      - POSTGRES_DB=permissiondb
      - POSTGRES_USER=permissionuser
      - POSTGRES_PASSWORD=permissionpassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db
    networks:
      - perm-network
      - microservices-network

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - PGUSER=permissionadmin
      - POSTGRES_DB=permissiondb
      - POSTGRES_USER=permissionuser
      - POSTGRES_PASSWORD=permissionpassword
    ports:
      - "5432:5432"
    networks:
      - perm-network
    healthcheck:
#      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: auth-redis1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # Enable persistence
    networks:
      - perm-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  perm-network:
    driver: bridge
  microservices-network:
    external: true

